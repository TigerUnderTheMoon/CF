route:
  id: real_task_v3_8_prm_locked_scoring
  version: "3.8"
  description: "Frozen PRM scoring baseline on the v3.6 PRM800K hash split."
  claim_scope: "in-distribution PRM baseline comparison context only"

source_route:
  id: real_task_v3_6_prm800k_hash
  config: configs/real_task_v3_6_prm800k_hash_validation.yaml
  dev_model: outputs/real_task_v3_6_prm800k_hash/dev_w_struct_model.json
  locked_report: outputs/real_task_v3_6_prm800k_hash/locked_validation_report.json
  contamination_audit: outputs/real_task_v3_7_prm_baseline_comparison/training_overlap_audit.json

model:
  default_model_id: Skywork/Skywork-o1-Open-PRM-Qwen-2.5-1.5B
  revision: 98d69606595eedbdbbbf0a7d28efdcd462ba6a67
  revision_source: "AutoDL Hugging Face cache snapshot observed during v3.8 locked scoring"
  scorer_backend: skywork_prefix
  batch_size: 8
  max_seq_length: 4096
  dtype: bfloat16
  trust_remote_code: true
  step_score_semantics: prefix_sequence_reward_probability

subsets:
  primary: locked
  canary_samples: 50

validation_gates:
  min_alignment_success_rate: 0.95
  max_exclusion_rate: 0.05
  min_finite_score_rate: 0.999
  require_nonconstant_scores: true
  bootstrap_samples: 10000
  bootstrap_seed: 42
  holm_alpha: 0.05

outputs:
  root: outputs/real_task_v3_8_prm_locked_scoring
  canary_report: canary_report.json
  locked_scores: locked_prm_scores.jsonl
  locked_report: locked_prm_baseline_comparison_report.json
  decision_report: decision_report.json

claim_policy:
  in_distribution_prm_baseline_context_allowed: true
  external_generalization_claim_allowed: false
  prm_training_claim_allowed: false
  replay_claim_allowed: false
