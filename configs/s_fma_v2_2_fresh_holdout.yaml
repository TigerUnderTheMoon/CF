experiment:
  name: s_fma_v2_2_fresh_holdout
  status: planned_preregistration_only
  seed: 20260605
  output_dir: outputs/s_fma_v2_2_fresh_holdout
  plan_file: paper/s_fma_v2_2_preregistration_plan.md
  transition_audit_file: paper/v2_1_to_v2_2_transition_audit.md
  current_task_scope: S_FMA_V2_2_PREREGISTRATION_ONLY_AFTER_FULL_VALIDATION_FAILURE
  no_api_execution_without_user_approval: true
  no_api_run_in_current_task: true
  no_manifest_generation_in_current_task: true
  no_full_api_generation_in_current_task: true
  no_replay_in_current_task: true
  no_scoring_in_current_task: true
  no_prm_filtering_in_current_task: true
  user_approved_budget_usd: null

provenance_boundary:
  current_project_status: PILOT_BLOCKED
  source_route: s_fma_v2_1_full_stochastic_validation
  source_status: V2_1_FULL_STOCHASTIC_FAIL_SCHEMA_OR_TAGS
  source_failure_codes:
    - V2_1_FULL_STOCHASTIC_FAIL_SCHEMA_OR_TAGS
    - V2_1_FULL_STOCHASTIC_FAIL_SPARSE_SIGNAL
  source_artifacts:
    full_report: outputs/s_fma_v2_1_fresh_holdout/v2_1_full_stochastic_report.json
    rank_signal_report: outputs/s_fma_v2_1_fresh_holdout/v2_1_full_stochastic_rank_signal_report.json
    failure_audit_json: outputs/s_fma_v2_1_fresh_holdout/v2_1_full_validation_failure_audit.json
    failure_audit_md: outputs/s_fma_v2_1_fresh_holdout/v2_1_full_validation_failure_audit.md
    route_decision: paper/full_validation_route_decision.md
  source_failure_summary:
    json_parse_success_rate: 0.9971181556195965
    schema_success_rate: 0.9971181556195965
    tag_extraction_success_rate: 0.9971181556195965
    final_answer_parse_success_rate: 0.9971181556195965
    timeout_or_connection_failure_attempts: 8
    gsm8k_nonzero_delta_u_rows: 16
    v2_1_preregistered_gsm8k_nonzero_delta_u_threshold: 20
    full_task_specific_status: false
    full_global_status: false
  allowed_uses:
    - failure_provenance
    - route_motivation
    - reviewer_facing_failure_explanation
  forbidden_uses:
    - tune_v2_2_thresholds_from_v2_1_full_artifacts
    - fit_v2_2_weights_from_v2_1_full_artifacts
    - select_v2_2_rows_from_v2_1_full_artifacts
    - relabel_v2_1_full_validation_as_success
    - infer_downstream_prm_filtering_gain

motivation:
  problems_addressed:
    - gsm8k_binary_exact_match_delta_u_sparsity
    - exact_1_0_full_scale_quality_gate_brittleness_under_transport_failures
    - incomplete_stochastic_repeated_replay_uncertainty_reporting
  design_response:
    gsm8k: repeated_probability_primary_utility_target
    hotpotqa: alias_aware_normalized_token_f1_primary_target
    quality_gate: bounded_repair_with_explicit_failure_accounting
    uncertainty: bootstrap_ci_variance_for_all_rank_metrics

fresh_split_policy:
  route_options:
    - fresh_non_overlapping_holdout
    - new_preregistered_split
  preferred_route: fresh_non_overlapping_holdout
  manifest_generation_authorized_by_this_config: false
  non_overlap_required_before_execution: true
  required_non_overlap_keys:
    - sample_id
    - task_id
    - dataset_config_split_source_index
    - normalized_question_hash
    - reference_answer_hash
    - non_empty_alias_hash
  overlap_policy:
    any_required_key_overlap: hard_stop_before_api_replay_scoring_reporting
    empty_alias_set_policy: non_informative_not_blocking
    non_empty_alias_hash_overlap: hard_stop
  forbidden_selection_fields:
    - correctness
    - original_score
    - intervened_score
    - delta_u
    - replay_outcome
    - final_answer
    - reference_answer_similarity_after_generation
    - rank_signal
    - target_outcome
    - v2_1_full_validation_result
  tasks:
    gsm8k:
      dataset: gsm8k
      config: main
      split: test_or_new_preregistered_split
      planned_sample_count: 200
      selection_policy: locked_before_manifest_generation
    hotpotqa:
      dataset: hotpot_qa
      config: distractor
      split: validation_or_new_preregistered_split
      planned_sample_count: 200
      selection_policy: locked_before_manifest_generation

utility_target:
  target_name: graded_stochastic_delta_u_v2_2
  delta_u_definition: original_primary_utility_minus_mean_intervened_primary_utility
  aggregation:
    span_level: mean_over_preregistered_replay_repeats
    sample_level: mean_over_eligible_spans
    task_level: mean_over_sample_level_delta_u
    global_level: pooled_sample_level_with_task_reported_separately
    bootstrap_unit: sample_id
  repeated_replay:
    original_generation_repeats_per_sample: 3
    intervention_replay_repeats_per_span: 3
    key_row_repeats_per_span_min: 5
    repeat_counts_locked_before_execution: true
  tasks:
    gsm8k:
      primary_score_field: repeated_numeric_success_probability
      scorer_helper: fma.real_task_pilot.metrics.normalize_gsm8k_answer
      exact_match_role: secondary_single_run_reporting_metric
      primary_utility_definition: mean_numeric_exact_match_indicator_over_preregistered_repeats
      numeric_parse_failure_reported: true
      repeated_answer_agreement_reported: true
      optional_graded_numeric_error_score_allowed_only_if_preregistered_before_execution: true
      rationale: avoid_single_run_binary_exact_match_delta_u_sparsity
    hotpotqa:
      primary_score_field: normalized_token_f1
      scorer_helper: fma.real_task_pilot.metrics.normalized_token_f1
      primary_f1_policy: max_over_reference_answer_and_non_empty_aliases_after_normalization
      reference_only_f1_reported: true
      alias_aware_exact_match_role: secondary_reporting_metric
      llm_judge_allowed: false
      normalization_policy:
        - lowercase
        - punctuation_to_space
        - remove_articles_a_an_the
        - collapse_whitespace
      alias_policy:
        empty_alias_set_policy: non_informative
        non_empty_aliases_used_for_primary_f1_max: true
        non_empty_alias_hash_blocks_overlap: true
      rationale: retain_normalized_token_f1_with_explicit_alias_policy

schema_transport_policy:
  silent_ignore_forbidden: true
  failed_attempts_count_against_quality_and_coverage: true
  bounded_repair_policy:
    allowed: true
    authorized_by_this_config: false
    repairable_failure_classes:
      - api_timeout
      - api_connection_error
      - transport_output_extraction_failure
    answer_content_editing_allowed: false
    preserve_all_failed_attempts: true
    max_repair_attempts_per_failed_request: 2
    max_total_repair_attempt_fraction: 0.03
    max_unrepaired_failure_fraction_per_task: 0.01
    report_initial_failure_rates: true
    report_repaired_failure_rates: true
    report_unrepaired_failure_counts: true
    no_retroactive_success_for_v2_1_artifacts: true
  hard_stop_conditions:
    - unrepaired_failure_fraction_exceeds_cap
    - failure_attempts_missing_from_audit
    - schema_or_transport_failure_silently_dropped
    - answer_content_repaired_after_generation

rank_signal_reporting:
  metrics:
    - spearman
    - kendall_tau_b
    - ndcg_at_3
    - ndcg_at_5
    - ndcg_at_10
    - top_10_percent_high_utility_auc
    - top_20_percent_high_utility_auc
  uncertainty:
    bootstrap_ci_required: true
    bootstrap_standard_error_required: true
    bootstrap_variance_required: true
    bootstrap_unit: sample_id
    confidence_level: 0.95
    resamples: 10000
    random_seed: 20260605
  reports:
    - gsm8k_task_specific
    - hotpotqa_task_specific
    - pooled_global
  target_variation_diagnostics:
    report_distinct_primary_utility_values: true
    report_primary_utility_standard_deviation: true
    report_nonzero_delta_u_count: true
    report_fractional_delta_u_count: true

gates:
  task_specific:
    label: TASK_SPECIFIC_S_FMA_V2_2_GATE
    evaluated_independently_by_task: true
    claim_scope_if_satisfied: task_specific_or_heterogeneous_only
    requires:
      - fresh_split_or_new_preregistered_split_locked
      - non_overlap_audit_clean
      - utility_target_locked_before_execution
      - no_v2_1_full_artifact_threshold_tuning
      - valid_trace_coverage_meets_preregistered_threshold
      - eligible_span_coverage_meets_preregistered_threshold
      - replay_success_meets_preregistered_threshold
      - schema_transport_failures_reported_and_within_preregistered_policy
      - primary_target_variation_meets_preregistered_threshold
      - spearman_kendall_ndcg_top_k_auc_reported_with_bootstrap_uncertainty
      - task_rank_signal_meets_preregistered_standard
    does_not_unlock:
      - global_claim
      - prm_filtering_design
      - prm_filtering_execution
      - comparative_downstream_gain_claim
  global:
    label: GLOBAL_S_FMA_V2_2_GATE
    requires:
      - gsm8k_TASK_SPECIFIC_S_FMA_V2_2_GATE_satisfied
      - hotpotqa_TASK_SPECIFIC_S_FMA_V2_2_GATE_satisfied
      - pooled_rank_signal_meets_preregistered_standard
      - no_active_overlap_leakage_schema_transport_or_target_variation_stop_condition
      - same_table_v2_2_and_required_baselines
    unlocks:
      - larger_real_task_expansion_design
    does_not_establish:
      - downstream_prm_filtering_gain

downstream_policy:
  prm_filtering_status: downstream_blocked
  no_prm_filtering_until:
    - GLOBAL_S_FMA_V2_2_GATE_satisfied
    - DOWNSTREAM_PRM_FILTERING_VALIDATION_GATE_satisfied
  single_task_gate_sufficient_for_prm_filtering: false
  required_future_baselines:
    - vanilla_prm
    - length_calibrated_prm
    - token_attribution
    - heuristic_reflection_scoring
    - frozen_reflection_weight_baseline

claim_policy:
  current_status_must_remain:
    - PILOT_BLOCKED
    - v2_2_preregistered_only
    - no_api_authorized
    - no_manifest_generated
    - no_replay_run
    - no_scoring_run
    - no_prm_filtering_claim
  allowed_before_execution:
    - v2_2_preregistration
    - v2_1_failed_full_validation_provenance
    - target_sparsity_motivation
    - bounded_repair_policy_specification
    - bootstrap_uncertainty_reporting_specification
  forbidden:
    - v2_2_validation_success_assertion
    - v2_1_full_validation_success_assertion
    - same_artifact_gate_relaxation_assertion
    - deterministic_replay_positive_evidence_assertion
    - top_tier_readiness_assertion
    - prm_filtering_execution_assertion
    - comparative_downstream_gain_assertion

future_execution_boundary:
  api_calls_authorized: false
  manifest_generation_authorized: false
  replay_authorized: false
  scoring_authorized: false
  prm_filtering_authorized: false
  future_approval_required_for:
    - manifest_generation
    - api_preflight
    - full_validation_api_run
    - replay_execution
    - scoring
    - prm_filtering_design
  approval_package_must_state:
    - target_route
    - split_source
    - non_overlap_audit
    - prompt_version
    - utility_target
    - schema_transport_repair_policy
    - expected_api_request_count
    - approved_budget_ceiling
    - stop_conditions
    - claim_boundary
