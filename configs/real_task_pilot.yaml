experiment:
  name: real_task_pilot
  seed: 20260530
  output_dir: outputs/real_task_pilot
  sample_manifest: outputs/real_task_pilot/sample_manifest.json
  max_samples_per_task: 200
  preflight_samples: 20
  pilot_generation_requests: 400
  user_approved_budget_usd: 150
  max_api_requests_pilot: 3600

api:
  endpoint: /v1/responses
  api_date: 2026-05-30
  service_tier: default
  store: false
  request_timeout_seconds: 45
  seed_transport: extra_body_then_retry_without_seed
  retry_policy:
    max_attempts: 2
    backoff_seconds: 2
  structured_output:
    primary: json_schema
    fallback: json_object
    schema_path: schemas/real_task_trace.schema.json

model:
  primary: gpt-5.5
  fallback_order:
    - gpt-5.5
    - gpt-5.4
  reasoning:
    effort: none
    unsupported_policy: log_and_retry_without_reasoning
  temperature: 0.0
  top_p: 1.0
  max_output_tokens: 2048

data:
  export_dir: data/real_task_pilot
  tasks:
    gsm8k:
      dataset: gsm8k
      config: main
      split: test
      count: 200
      metric: exact_match
    hotpotqa:
      dataset: hotpot_qa
      config: distractor
      split: validation
      count: 200
      metric: exact_match
      appendix_metrics:
        - normalized_token_f1
        - alias_match

pricing:
  input_per_million_usd: 5.0
  output_per_million_usd: 30.0
  basis: gpt-5.5 configured pilot ceiling

seed_probe:
  repeats: 3
  models:
    - gpt-5.5
    - gpt-5.4
    - gpt-5.1
    - gpt-4o-2024-08-06

nondeterministic_protocol:
  disclosure_required: true
  allow_400_trace_generation: true
  repeats:
    original_generation_per_sample: 1
    replay_per_span: 3
    key_sample_replay_per_span: 5
  bootstrap:
    resamples: 10000
    confidence_level: 0.95
    unit: sample_id
    random_seed: 20260530
  gates:
    minimum_schema_success_rate: 0.95
    minimum_tag_success_rate: 0.95
    minimum_valid_traces: 300
    minimum_span_validity_rate: 0.90
    minimum_replay_success_rate: 0.85
    effect_gate: bootstrap_ci_lower_gt_zero_by_task_or_pooled_with_task_pass

generation:
  prompt_file: prompts/real_task_reflection_generation.txt
  required_tag: reflection
  trace_field: observable_trace
  legacy_trace_field: reasoning_trace
  required_valid_traces: 300
  minimum_schema_success_rate: 0.95
  minimum_tag_success_rate: 0.95

replay:
  prompt_file: prompts/real_task_replay.txt
  mask_token: "[REASONING_MASK]"
  max_spans_per_trace: 3
  minimum_success_rate: 0.85
  token_audit: local_tokenizer_proxy
  token_preservation_policy: approximate_for_api
  no_post_target_leakage: true

baselines:
  independent_scorers:
    - random
    - span_length
    - relative_position
    - taxonomy_prior
    - uniform_reflection_weight
    - question_difficulty_proxy
  intervention_protocol_controls:
    - random_reflection_masking
    - span_masking
    - graph_removal
    - edge_dropout
  forbidden_source_fields:
    - correctness
    - original_score
    - intervened_score
    - delta_u
    - necessity
    - structural_necessity
    - attribution_score
    - replay_outcome

trajectory_controls:
  variants:
    - no_reflection
    - tagged_reflection
    - self_refine_style
    - reflexion_style
  report_metrics:
    - accuracy
    - tokens
    - validity
    - reflection_count
    - cost

readiness:
  pilot_pass:
    valid_traces_min: 300
    span_validity_min: 0.90
    replay_success_min: 0.85
  expand_to_top_tier_scale:
    per_task_spearman_ci_lower_gt_zero: true
    pooled_ci_lower_gt_zero_with_one_task_pass: true
    allowed_effect_labels:
      - small
      - medium
      - large
