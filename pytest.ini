[pytest]
pythonpath =
    src
    .
testpaths =
    tests/unit
    tests/integration
    tests/regression
addopts =
    -m "not slow and not regression"
    --strict-markers
    --cov=src/fma
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
markers =
    slow: tests that require live APIs or other expensive external services; skipped by default
    regression: historical output hash/snapshot tests; run only in full CI
