name: paper-build

on:
  push:
    paths:
      - "dvc.yaml"
      - "dvc.lock"
      - "outputs/**"
      - "paper/**"
      - "scripts/**"
      - "tests/test_claim_boundaries.py"
      - "tests/test_dvc_contract.py"
      - "tests/test_kbs_submission_package_verifier.py"
      - "tests/test_ipm_submission_package_verifier.py"
      - ".github/workflows/paper-build.yml"
  pull_request:
    paths:
      - "dvc.yaml"
      - "dvc.lock"
      - "outputs/**"
      - "paper/**"
      - "scripts/**"
      - "tests/test_claim_boundaries.py"
      - "tests/test_dvc_contract.py"
      - "tests/test_kbs_submission_package_verifier.py"
      - "tests/test_ipm_submission_package_verifier.py"
      - ".github/workflows/paper-build.yml"

jobs:
  paper-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python and DVC dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            pyyaml numpy scipy pandas matplotlib seaborn tabulate jsonschema \
            jsonlines networkx pydantic omegaconf structlog dvc pytest

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-publishers texlive-bibtex-extra poppler-utils

      - name: Active claim-boundary and citation-placeholder scan
        run: python scripts/check_claim_boundaries.py --active-only

      - name: Verify KBS DOI anchors
        run: |
          for doi in \
            10.1016/j.knosys.2025.113503 \
            10.1016/j.knosys.2025.113648 \
            10.1016/j.knosys.2024.112410; do
            curl -I -L https://doi.org/${doi}
          done
          python scripts/check_claim_boundaries.py --check-dois

      - name: Verify KBS final package contract
        run: |
          python scripts/verify_kbs_submission_package.py \
            --package-dir paper/kbs_submission/final_package \
            --require-author-metadata \
            --require-pdf-text \
            --min-manuscript-pages 12 \
            --max-manuscript-pages 20

      - name: Build KBS LaTeX source
        working-directory: paper/kbs_submission/final_source
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error manuscript.tex

      - name: Verify IPM final package contract
        run: |
          python scripts/verify_ipm_submission_package.py \
            --package-dir paper/ipm_submission/final_package \
            --require-author-metadata \
            --require-pdf-text \
            --min-manuscript-pages 12 \
            --max-manuscript-pages 20

      - name: Build IPM LaTeX source
        working-directory: paper/ipm_submission/final_source
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error manuscript.tex

      - name: DVC reproducibility or contract-only fallback
        run: |
          set -e
          if dvc remote list | grep -q . && dvc status --show-json >/tmp/dvc-status.json; then
            dvc repro
            dvc status --quiet
          else
            dvc dag --dry || dvc dag
            dvc status --show-json || true
            echo "DVC remote unavailable in CI; pipeline contract-only check passed"
          fi

      - name: Targeted contract tests
        run: |
          python -m pytest \
            tests/test_prm800k_audit_prioritization.py \
            tests/test_claim_boundaries.py \
            tests/test_kbs_submission_package_verifier.py \
            tests/test_ipm_submission_package_verifier.py \
            tests/test_dvc_contract.py \
            -q
