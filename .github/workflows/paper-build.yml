name: paper-build

on:
  push:
    paths:
      - "outputs/**"
      - "paper/**"
      - "scripts/check_paper_figure_inventory.py"
      - ".github/workflows/paper-build.yml"
  pull_request:
    paths:
      - "outputs/**"
      - "paper/**"
      - "scripts/check_paper_figure_inventory.py"
      - ".github/workflows/paper-build.yml"

jobs:
  paper-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python render dependencies
        run: python -m pip install --upgrade pandas matplotlib seaborn tabulate jupyter pyyaml

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render executable paper
        run: quarto render paper

      - name: Check generated PDF
        run: ls paper/_book/*.pdf

      - name: Check figure inventory consistency
        run: python scripts/check_paper_figure_inventory.py --paper-dir paper --require-generated
